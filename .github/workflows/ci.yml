name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: zyplux/zyplux/apps/action-setup-pm@setup-pm-v1
      - run: pnpm run knip
      - run: pnpm run knip --config knip.prod.json
      - run: uv run --no-sync vulture
      - run: pnpm run typecheck
      - run: uv run --no-sync rumdl check
      - run: uv run --no-sync rumdl fmt --check
      - run: pnpm run lint
      - run: pnpm exec prettier --check .
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pyrefly check
      - run: pnpm run test
      - run: uv run --no-sync pytest
      - run: uv run --no-sync cerberus
        env:
          GH_TOKEN: ${{ github.token }}
